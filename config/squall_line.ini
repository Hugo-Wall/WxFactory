[Grid]
grid_type = cartesian3d
lateral_boundary = periodic
x0 = -25000
x1 = 25000
y0 = 0
y1 = 12000
z0 = 0
z1 = 24000

[Test_case]
equations = euler
case_number = 1001

[Time_integration]
dt = 0.25
t_end = 1000.0
time_integrator = epi2
exponential_solver=pmex
krylov_size = 10
tolerance = 1e-6

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 15
num_elements_vertical   = 11

jacobian = analytic

# Weak post-step modal filter
expfilter_apply = 1
expfilter_order = 4
expfilter_cutoff = 0.5
expfilter_strength = 0.2

[Grid_scale_precipitation]
enable_gscp = 1

[Output_options]
stat_freq = 1
output_freq = 10
output_dir = results/squall_line
