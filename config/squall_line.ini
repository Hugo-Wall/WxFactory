[Grid]
grid_type = cartesian3d
lateral_boundary = wall
x0 = 0
x1 = 150000
y0 = 0
y1 = 12000
z0 = 0
z1 = 24000

[Test_case]
equations = euler
case_number = -1 # TODO: determine

[Time_integration]
dt = 0.25
t_end = 9000
time_integrator = epi2
exponential_solver=pmex
krylov_size = 10
tolerance = 1e-6

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 43
num_elements_vertical   = 11

[Output_options]
stat_freq = 1
output_freq = 1
output_dir = results/squall_line
